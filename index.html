function mobileToEmail(mobile) {
  return mobile.replace(/\D/g,'') + '@pb.erp';
}

async function doLogin() {
  const mobile   = document.getElementById('login-mobile').value.trim();
  const password = document.getElementById('login-password').value;
  if (!mobile || !password) { setLoginError('Enter mobile and password'); return; }

  const { data, error } = await _sb.auth.signInWithPassword({ email: mobileToEmail(mobile), password });
  if (error) { setLoginError(error.message); return; }
  await afterLogin(data.user);
}

async function afterLogin(user) {
  const { data: profile, error } = await _sb.from('profiles').select('*').eq('id', user.id).single();
  if (error || !profile) { setLoginError('Profile not found. Ask admin.'); await _sb.auth.signOut(); return; }
  ME = profile;
  toast('Welcome, ' + ME.name);
  await loadAppData();
  showApp();
}

async function doLogout() {
  await _sb.auth.signOut();
  ME  = null;
  APP = { parties: [], txns: [], openings: [], profiles: [] };
  document.getElementById('login-mobile').value    = '';
  document.getElementById('login-password').value = '';
  showLogin();
}

function setLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.classList.remove('hidden');
}

// ════════════════════════════════════════════════════════════
//  DATA
// ════════════════════════════════════════════════════════════
async function loadAppData() {
  const baseQ = [
    _sb.from('parties').select('*').order('name'),
    _sb.from('transactions').select('*').gte('date', FY_START).order('date'),
    _sb.from('opening_balances').select('*'),
  ];
  if (ME.role === 'admin') baseQ.push(_sb.from('profiles').select('*').order('name'));

  const [pRes, tRes, oRes, prRes] = await Promise.all(baseQ);
  APP.parties  = pRes.data  || [];
  APP.txns     = tRes.data  || [];
  APP.openings = oRes.data  || [];
  APP.profiles = prRes?.data || [];
}

function patchCache(table, row, op = 'upsert') {
  const arr = APP[table];
  if (!arr) return;
  if (op === 'insert') {
    arr.push(row);
  } else if (op === 'upsert') {
    const i = arr.findIndex(r => r.id === row.id);
    if (i >= 0) arr[i] = { ...arr[i], ...row }; else arr.push(row);
  } else if (op === 'delete') {
    const i = arr.findIndex(r => r.id === row.id);
    if (i >= 0) arr.splice(i, 1);
  }
}

// ════════════════════════════════════════════════════════════
//  CALCULATIONS
// ════════════════════════════════════════════════════════════
function daysDiff(from, to) {
  return Math.floor((from - to) / 86400000);
}

function calcAging(partyId) {
  const today = new Date(); today.setHours(0,0,0,0);
  const ob = APP.openings.find(o => o.party_id === partyId && o.as_on_date === FY_START);
  let b = { b0:0, b31:0, b61:0, b90:0 };

  // Opening balance aged from FY_START (April 1 = 0 days old on that date)
  if (ob) {
    const obTotal = (+ob.amt_90_plus) + (+ob.amt_61_90) + (+ob.amt_31_60) + (+ob.amt_0_30);
    if (obTotal > 0) {
      const obAge = daysDiff(today, new Date(FY_START));
      if      (obAge <= 30) b.b0  += obTotal;
      else if (obAge <= 60) b.b31 += obTotal;
      else if (obAge <= 90) b.b61 += obTotal;
      else                  b.b90 += obTotal;
    }
  }

  APP.txns
    .filter(t => t.party_id === partyId)
    .sort((a,c) => new Date(a.date) - new Date(c.date))
    .forEach(t => {
      const age = daysDiff(today, new Date(t.date));
      if (t.type === 'bill') {
        if      (age <= 30) b.b0  += +t.amount;
        else if (age <= 60) b.b31 += +t.amount;
        else if (age <= 90) b.b61 += +t.amount;
        else                b.b90 += +t.amount;
      } else {
        let rem = +t.amount;
        for (const k of ['b90','b61','b31','b0']) {
          const d = Math.min(b[k], rem); b[k] -= d; rem -= d;
          if (rem <= 0) break;
        }
      }
    });

  b.total = b.b0 + b.b31 + b.b61 + b.b90;
  return b;
}

function getOutstanding(partyId) { return calcAging(partyId).total; }

function getLastDate(partyId, type) {
  const arr = APP.txns.filter(t => t.party_id === partyId && t.type === type);
  return arr.length ? arr.reduce((a,c) => a.date > c.date ? a : c).date : null;
}

function getLedger(partyId) {
  const ob = APP.openings.find(o => o.party_id === partyId && o.as_on_date === FY_START);
  let bal = ob ? +ob.total : 0;
  const rows = [{ date: FY_START, label:'Opening Balance', debit: bal, credit:0, balance: bal, type:'opening' }];
  APP.txns
    .filter(t => t.party_id === partyId)
    .sort((a,c) => new Date(a.date) - new Date(c.date))
    .forEach(t => {
      if (t.type === 'bill')           { bal += +t.amount; rows.push({ ...t, label:'Bill',        debit:+t.amount, credit:0,         balance:bal }); }
      else if (t.type==='credit_note') { bal -= +t.amount; rows.push({ ...t, label:'Credit Note', debit:0,          credit:+t.amount, balance:bal }); }
      else                             { bal -= +t.amount; rows.push({ ...t, label:'Payment',     debit:0,          credit:+t.amount, balance:bal }); }
    });
  return rows;
}

// ════════════════════════════════════════════════════════════
//  FORMATTING
// ════════════════════════════════════════════════════════════
const _fmt = new Intl.NumberFormat('en-IN', { maximumFractionDigits:0 });
function rupees(n) { return '₹' + _fmt.format(Math.round(+n || 0)); }
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-IN',{ day:'2-digit', month:'short', year:'2-digit' });
}
function today() { return new Date().toISOString().split('T')[0]; }
function firstOfMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
function modeBadge(mode) {
  const map = { cash:'bg-green-100 text-green-800', cheque:'bg-blue-100 text-blue-800', upi:'bg-purple-100 text-purple-800', discount:'bg-yellow-100 text-yellow-800' };
  return `<span class="px-2 py-0.5 rounded text-xs font-medium ${map[mode]||'bg-gray-100 text-gray-600'}">${mode||'na'}</span>`;
}

// ════════════════════════════════════════════════════════════
//  ROUTING
// ════════════════════════════════════════════════════════════
const VIEWS = {};
function reg(name, fn) { VIEWS[name] = fn; }

function goBack(fallback = 'dashboard') {
  if (prevView) navigate(prevView, prevParams);
  else navigate(fallback);
}

function navigate(name, params = {}) {
  prevView      = currentView;
  prevParams    = currentParams;
  currentView   = name;
  currentParams = params;
  const fn = VIEWS[name];
  const vc = document.getElementById('view-container');
  if (!fn) { vc.innerHTML = `<p class="text-red-500">View not found: ${name}</p>`; return; }
  vc.innerHTML = fn(params);
  renderNav();
  window.scrollTo(0, 0);
  if (name === 'verify') setTimeout(renderVerifyRows, 20);
  if (name === 'sales')  setTimeout(renderSalesTable, 20);
}

function renderNav() {
  const isAdmin = ME?.role === 'admin';
  const links = isAdmin ? [
    { n:'dashboard', l:'Dashboard' },
    { n:'bills',     l:'Bills' },
    { n:'verify',    l:'Verify' },
    { n:'parties',   l:'Parties' },
    { n:'sales',     l:'Sales' },
    { n:'users',     l:'Users' },
    { n:'import',    l:'Import' },
    { n:'settings',  l:'Settings' },
  ] : [
    { n:'smDashboard', l:'Dashboard' },
    { n:'partyList',   l:'My Parties' },
    { n:'sales',       l:'My Sales' },
  ];
  const unv = isAdmin ? APP.txns.filter(t => t.type==='payment' && !t.verified).length : 0;

  document.getElementById('nav-bar').innerHTML = `
    <div class="flex items-center justify-between px-3 py-2 flex-wrap gap-1">
      <span class="font-bold text-base tracking-tight">PB&nbsp;ERP</span>
      <div class="flex flex-wrap gap-1 items-center">
        ${links.map(({n,l}) => `
          <button onclick="navigate('${n}')"
            class="px-2.5 py-1 rounded text-xs font-medium transition
                   ${currentView===n ? 'bg-white text-blue-700' : 'text-blue-100 hover:bg-blue-600'}">
            ${l}${n==='verify'&&unv>0 ? `<span class="ml-1 bg-red-500 text-white text-[10px] rounded-full px-1">${unv}</span>` : ''}
          </button>`).join('')}
        <span class="text-blue-300 text-xs hidden sm:inline">| ${ME?.name}</span>
        <button onclick="doLogout()" class="px-2.5 py-1 rounded text-xs text-blue-200 hover:bg-blue-600">Logout</button>
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════════════
function toast(msg, type='ok') {
  const el = document.createElement('div');
  const bg = type==='error' ? 'bg-red-600' : type==='warn' ? 'bg-yellow-500' : 'bg-green-600';
  el.className = `${bg} text-white text-sm px-4 py-2 rounded-lg shadow-lg pointer-events-auto`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3400);
}

function showModal(html) {
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');

function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }

function showLogin() {
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('login-error').classList.add('hidden');
}
function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  if (ME.role === 'admin') navigate('dashboard');
  else navigate('smDashboard');
}

// ════════════════════════════════════════════════════════════
//  VIEW: DASHBOARD
// ════════════════════════════════════════════════════════════
reg('dashboard', () => {
  const totalOut   = APP.parties.reduce((s,p) => s + getOutstanding(p.id), 0);
  const todayStr   = today();
  const todayColl  = APP.txns.filter(t => t.type==='payment' && t.date===todayStr).reduce((s,t) => s + +t.amount, 0);
  const unv        = APP.txns.filter(t => t.type==='payment' && !t.verified).length;
  const fom        = firstOfMonth();
  const mtdSales   = APP.txns.filter(t => t.type==='bill' && t.date>=fom).reduce((s,t) => s + +t.amount, 0);

  const rows = APP.profiles.filter(p => p.role==='salesman').map(sm => {
    const pts      = APP.parties.filter(p => p.salesman_id===sm.id);
    const out      = pts.reduce((s,p) => s + getOutstanding(p.id), 0);
    const pids     = new Set(pts.map(p=>p.id));
    const fomTxns  = APP.txns.filter(t => t.date>=fom && pids.has(t.party_id));
    const mtd      = fomTxns.filter(t=>t.type==='payment').reduce((s,t) => s + +t.amount, 0);
    const mtdBills = fomTxns.filter(t=>t.type==='bill').reduce((s,t) => s + +t.amount, 0);
    const mtdCN    = fomTxns.filter(t=>t.type==='credit_note').reduce((s,t) => s + +t.amount, 0);
    const uv       = APP.txns.filter(t => t.type==='payment' && !t.verified && pids.has(t.party_id)).length;
    return { sm, cnt: pts.length, out, mtd, mtdNet: mtdBills - mtdCN, uv };
  });

  return `
  <div class="max-w-5xl mx-auto">
    <h2 class="text-2xl font-bold mb-5">Dashboard</h2>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-2xl shadow p-5">
        <p class="text-xs text-gray-400 uppercase mb-1">Total Outstanding</p>
        <p class="text-2xl font-bold text-blue-700">${rupees(totalOut)}</p>
      </div>
      <div class="bg-white rounded-2xl shadow p-5">
        <p class="text-xs text-gray-400 uppercase mb-1">MTD Sales</p>
        <p class="text-2xl font-bold text-indigo-600">${rupees(mtdSales)}</p>
      </div>
      <div class="bg-white rounded-2xl shadow p-5">
        <p class="text-xs text-gray-400 uppercase mb-1">Today's Collections</p>
        <p class="text-2xl font-bold text-green-600">${rupees(todayColl)}</p>
      </div>
      <div class="bg-white rounded-2xl shadow p-5 cursor-pointer hover:bg-gray-50" onclick="navigate('verify')">
        <p class="text-xs text-gray-400 uppercase mb-1">Pending Verification</p>
        <p class="text-2xl font-bold ${unv>0?'text-red-500':'text-gray-400'}">${unv}</p>
      </div>
    </div>
    <div class="bg-white rounded-2xl shadow overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-xs uppercase text-gray-500">
          <tr>
            <th class="px-4 py-3 text-left">Salesman</th>
            <th class="px-4 py-3 text-right">Parties</th>
            <th class="px-4 py-3 text-right">Outstanding</th>
            <th class="px-4 py-3 text-right">MTD Net Sales</th>
            <th class="px-4 py-3 text-right">MTD Collection</th>
            <th class="px-4 py-3 text-right">Unverified</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
          <tr class="border-t hover:bg-gray-50">
            <td class="px-4 py-3 font-medium">${r.sm.name}</td>
            <td class="px-4 py-3 text-right">${r.cnt}</td>
            <td class="px-4 py-3 text-right font-semibold">${rupees(r.out)}</td>
            <td class="px-4 py-3 text-right text-indigo-600 font-semibold">${rupees(r.mtdNet)}</td>
            <td class="px-4 py-3 text-right text-green-600">${rupees(r.mtd)}</td>
            <td class="px-4 py-3 text-right ${r.uv>0?'text-red-500 font-bold':''}">${r.uv||'—'}</td>
            <td class="px-4 py-3">
              <button onclick="sendWhatsAppReminder('${r.sm.id}')"
                      class="text-xs bg-green-500 text-white px-2 py-1 rounded-lg hover:bg-green-600 whitespace-nowrap">
                📱 Remind
              </button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
});

// ════════════════════════════════════════════════════════════
//  VIEW: BILLS
// ════════════════════════════════════════════════════════════
reg('bills', () => {

  return `
  <div class="max-w-5xl mx-auto">
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <h2 class="text-2xl font-bold">Bills <span class="text-gray-400 text-lg">(${bills.length})</span></h2>
      <button onclick="showAddBillModal()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-blue-700">+ Add Bill</button>
    </div>
    <input type="text" placeholder="Search party or ref…" oninput="filterRows(this,'bill-row')"
           class="w-full border rounded-xl px-3 py-2 mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
    <div class="bg-white rounded-2xl shadow overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-xs uppercase text-gray-500">
          <tr>
            <th class="px-4 py-3 text-left">Date</th>
            <th class="px-4 py-3 text-left">Party</th>
            <th class="px-4 py-3 text-left">Ref</th>
            <th class="px-4 py-3 text-right">Amount</th>
            <th class="px-4 py-3 text-left">Salesman</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody>
          ${bills.map(b => {
            const party = APP.parties.find(p => p.id===b.party_id);
            const sm    = APP.profiles.find(p => p.id===b.salesman_id) || APP.profiles.find(p => p.id===party?.salesman_id);
            return `<tr class="border-t hover:bg-gray-50 bill-row" data-q="${((party?.name||'')+' '+(b.ref||'')).toLowerCase()}">
              <td class="px-4 py-3 text-gray-500">${fmtDate(b.date)}</td>
              <td class="px-4 py-3 font-medium text-blue-600 cursor-pointer hover:underline"
                  onclick="navigate('partyLedger',{partyId:'${b.party_id}'})">${party?.name||'—'}</td>
              <td class="px-4 py-3 text-gray-400">${b.ref||'—'}</td>
              <td class="px-4 py-3 text-right font-semibold">${rupees(b.amount)}</td>
              <td class="px-4 py-3 text-gray-500">${sm?.name||'—'}</td>
              <td class="px-4 py-3">
                <button onclick="showEditTxnModal('${b.id}')" class="text-xs text-blue-600 hover:underline">Edit</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
});

function filterRows(inp, cls) {
  const q = inp.value.toLowerCase();
  document.querySelectorAll('.'+cls).forEach(row => {
    row.style.display = (row.dataset.q||row.dataset.name||'').toLowerCase().includes(q) ? '' : 'none';
  });
}

function renderVerifyRows() {
  const smId  = document.getElementById('vf-sm')?.value;
  const from  = document.getElementById('vf-from')?.value;
  const to    = document.getElementById('vf-to')?.value;
  const mode  = document.getElementById('vf-mode')?.value;

  let rows = APP.txns.filter(t => t.type==='payment' && !t.verified);
  if (smId) rows = rows.filter(t => APP.parties.find(p=>p.id===t.party_id)?.salesman_id === smId);
  if (from) rows = rows.filter(t => t.date >= from);
  if (to)   rows = rows.filter(t => t.date <= to);
  if (mode) rows = rows.filter(t => t.mode === mode);
  rows.sort((a,b) => a.date.localeCompare(b.date));

  const tbody = document.getElementById('verify-tbody');
  if (!tbody) return;
  // Update total bar
  const total = rows.reduce((s,t)=>s+(+t.amount),0);
  const cntEl = document.getElementById('vf-count'); if(cntEl) cntEl.textContent = rows.length;
  const totEl = document.getElementById('vf-total'); if(totEl) totEl.textContent = rupees(total);

  tbody.innerHTML = rows.length ? rows.map(t => {
    const party = APP.parties.find(p => p.id===t.party_id);
    const sm    = APP.profiles.find(p => p.id===(party?.salesman_id));
    return `<tr class="border-t hover:bg-gray-50">
      <td class="px-3 py-3"><input type="checkbox" class="vcb" data-id="${t.id}" onchange="updVerifyCount()"></td>
      <td class="px-4 py-3">${fmtDate(t.date)}</td>
      <td class="px-4 py-3 font-medium">${party?.name||'—'}</td>
      <td class="px-4 py-3 text-right font-semibold text-green-700">${rupees(t.amount)}</td>
      <td class="px-4 py-3 text-gray-500">${sm?.name||'—'}</td>
      <td class="px-4 py-3">${modeBadge(t.mode)}</td>
      <td class="px-4 py-3 text-gray-400 text-xs">${t.ref||'—'}</td>
      <td class="px-4 py-3">
        <button onclick="verifySingle('${t.id}')" class="bg-green-600 text-white text-xs px-2 py-1 rounded hover:bg-green-700">✓</button>
      </td>
    </tr>`;
  }).join('') : '<tr><td colspan="8" class="px-4 py-10 text-center text-gray-400">All payments verified ✓</td></tr>';
}

function updVerifyCount() {
  const n   = document.querySelectorAll('.vcb:checked').length;
  const btn = document.getElementById('verify-bulk-btn');
  if (btn) { btn.disabled = n===0; btn.textContent = `Verify Selected (${n})`; }
}
function toggleAllVerify(checked) {
  document.querySelectorAll('.vcb').forEach(cb => cb.checked = checked);
  updVerifyCount();
}

async function verifySingle(id) {
  const now = new Date().toISOString();
  const { error } = await _sb.from('transactions').update({ verified:true, verified_by:ME.id, verified_at:now }).eq('id',id);
  if (error) { toast(error.message,'error'); return; }
  patchCache('txns',{id,verified:true,verified_by:ME.id,verified_at:now});
  toast('Payment verified');
  renderVerifyRows(); renderNav();
}

async function verifySelected() {
  const ids = [...document.querySelectorAll('.vcb:checked')].map(cb=>cb.dataset.id);
  if (!ids.length) return;
  const now = new Date().toISOString();
  const { error } = await _sb.from('transactions').update({ verified:true, verified_by:ME.id, verified_at:now }).in('id',ids);
  if (error) { toast(error.message,'error'); return; }
  ids.forEach(id => patchCache('txns',{id,verified:true,verified_by:ME.id,verified_at:now}));
  toast(`${ids.length} payments verified`);
  renderVerifyRows(); renderNav();
}

let _pfUnpaid = false;

reg('parties', () => {
  _pfUnpaid = false;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-15);
  const cutoffStr = cutoff.toISOString().slice(0,10);

  const salesmen = APP.profiles.filter(p=>p.role==='salesman').sort((a,b)=>a.name.localeCompare(b.name));

  const rows = APP.parties.map(p => {
    const sm       = APP.profiles.find(pr=>pr.id===p.salesman_id);
    const out      = getOutstanding(p.id);
    const pmts     = APP.txns.filter(t=>t.party_id===p.id&&t.type==='payment');
    const lastPmt  = pmts.length ? pmts.reduce((a,c)=>a.date>c.date?a:c).date : null;
    const daysSince= lastPmt ? Math.floor((new Date()-new Date(lastPmt))/86400000) : 999;
    const unpaid15 = !lastPmt || lastPmt < cutoffStr;
    return { p, sm, out, lastPmt, daysSince, unpaid15 };
  }).sort((a, b) => b.out - a.out);

  const rowsHtml = rows.map(({p,sm,out,lastPmt,daysSince,unpaid15})=>`
    <tr class="border-t hover:bg-gray-50 prow"
        data-name="${p.name.toLowerCase()}"
        data-sm="${p.salesman_id||''}"
        data-unpaid="${unpaid15?'1':'0'}"
        data-out="${out}">
      <td class="px-4 py-3 font-medium text-blue-600 cursor-pointer hover:underline"
          onclick="navigate('partyLedger',{partyId:'${p.id}'})">${p.name}</td>
      <td class="px-4 py-3 text-right font-semibold ${out>0?'text-gray-900':'text-gray-300'}">${rupees(out)}</td>
      <td class="px-4 py-3 text-sm ${unpaid15?'text-red-500 font-semibold':'text-gray-500'}">
        ${lastPmt ? fmtDate(lastPmt)+` <span class="text-xs">(${daysSince}d ago)</span>` : '<span class="text-red-400">Never</span>'}
      </td>
      <td class="px-4 py-3 text-gray-500 text-sm">${sm?.name||'—'}</td>
      <td class="px-4 py-3"><button onclick="showEditPartyModal('${p.id}')" class="text-xs text-blue-500 hover:underline">Edit</button></td>
    </tr>`).join('');

  return `
  <div class="max-w-5xl mx-auto">
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <h2 class="text-2xl font-bold">Parties</h2>
      <button onclick="showAddPartyModal()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-blue-700">+ Add Party</button>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-2 mb-3">
      <input id="pf-search" type="text" placeholder="🔍 Search party…" oninput="filterParties()"
             class="flex-1 min-w-[160px] border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
      <select id="pf-sm" onchange="filterParties()"
              class="border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
        <option value="">All Salesmen</option>
        ${salesmen.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}
      </select>
      <button id="pf-unpaid-btn" onclick="togglePfUnpaid()"
              class="border rounded-xl px-3 py-2 text-sm font-medium text-gray-600 hover:bg-red-50 hover:border-red-300 hover:text-red-600 transition">
        ⏰ Not paid 15+ days
      </button>
    </div>

    <!-- Summary bar -->
    <div class="bg-blue-50 rounded-xl px-4 py-2 mb-3 flex flex-wrap gap-4 text-sm text-blue-800">
      <span>Showing: <b id="pf-count">—</b> parties</span>
      <span>|</span>
      <span>Total Outstanding: <b id="pf-total" class="text-blue-900">—</b></span>
    </div>

    <div class="bg-white rounded-2xl shadow overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-xs uppercase text-gray-500">
          <tr>
            <th class="px-4 py-3 text-left">Party Name</th>
            <th class="px-4 py-3 text-right">Outstanding</th>
            <th class="px-4 py-3 text-left">Last Payment</th>
            <th class="px-4 py-3 text-left">Salesman</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody id="parties-tbody">${rowsHtml}</tbody>
      </table>
    </div>
  </div>`;
});

function filterParties() {
  const q    = (document.getElementById('pf-search')?.value||'').toLowerCase();
  const smId = document.getElementById('pf-sm')?.value||'';
  const rows = document.querySelectorAll('#parties-tbody .prow');
  let count=0, total=0;
  rows.forEach(r=>{
    const nameMatch = !q || r.dataset.name.includes(q);
    const smMatch   = !smId || r.dataset.sm===smId;
    const unpMatch  = !_pfUnpaid || r.dataset.unpaid==='1';
    const show = nameMatch && smMatch && unpMatch;
    r.style.display = show ? '' : 'none';
    if (show) { count++; total += parseFloat(r.dataset.out)||0; }
  });
  const el = document.getElementById('pf-count'); if(el) el.textContent=count;
  const tl = document.getElementById('pf-total'); if(tl) tl.textContent=rupees(total);
}

function togglePfUnpaid() {
  _pfUnpaid = !_pfUnpaid;
  const btn = document.getElementById('pf-unpaid-btn');
  if(btn) {
    btn.className = _pfUnpaid
      ? 'border border-red-400 rounded-xl px-3 py-2 text-sm font-medium bg-red-50 text-red-600'
      : 'border rounded-xl px-3 py-2 text-sm font-medium text-gray-600 hover:bg-red-50 hover:border-red-300 hover:text-red-600 transition';
  }
  filterParties();
}

// Run filter once on load to populate count/total
setTimeout(filterParties, 50);

function readXlsx(inputId) {
  return new Promise((res, rej) => {
    const f = document.getElementById(inputId)?.files[0];
    if (!f) { rej('No file selected'); return; }
    const r = new FileReader();
    r.onload = e => res(XLSX.read(e.target.result, { type:'array', cellDates:true }));
    r.onerror = rej;
    r.readAsArrayBuffer(f);
  });
}

  const p = document.getElementById('p3');
  try {
    const wb   = await readXlsx('f3');
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1 });
    const pts  = parseLedger(rows);

    p.innerHTML = `
      <p class="text-gray-600 mb-2">${pts.length} parties · ${txns} transactions found</p>

        ${pts.length>6?`<div class="text-gray-400">…${pts.length-6} more</div>`:''}
      </div>
      <button onclick="confirmLedgers()" class="mt-2 bg-green-600 text-white px-4 py-2 rounded-xl text-sm">Confirm Import</button>`;
  } catch(e) { p.innerHTML = `<span class="text-red-500">Error: ${e.message||e}</span>`; }
}

function parseLedger(rows) {
  const out = []; let cur = null;
  for (const row of rows) {
    const [date, desc, ref, details,,debit, credit] = row;
    const ds = String(desc||'').trim();
    const dt = String(date||'').trim();
    if (ds.toLowerCase().includes('_2description_') || ds.toLowerCase()==='description') continue;
    if (!dt && ds && !['report total','balance c/f',''].includes(ds.toLowerCase()) && !ds.startsWith('_')) {
      cur = { name: ds, opening: 0, txns: [] }; out.push(cur); continue;
    }
    if (!cur || !dt) continue;
    const iso = xlDate(dt); if (!iso) continue;
    if (ds.toLowerCase().includes('balance b/f') || ds.toLowerCase().includes('opening')) {
      cur.opening = parseFloat(debit)||parseFloat(credit)||0; continue;
    }
    if (ds.toLowerCase().includes('balance c/f') || ds.toLowerCase().includes('closing balance')) continue;
    if (ds.toUpperCase().includes('SALES') && debit)
      cur.txns.push({ date:iso, type:'bill', amount:parseFloat(debit), ref:String(ref||'').trim() });
    else if (credit) {
      const det = String(details||'').toUpperCase();
      let mode = 'na';
      if (det.includes('CHEQ')||det.includes('CHQ')) mode='cheque';
      else if (det.includes('UPI')||det.includes('NEFT')||det.includes('RTGS')||det.includes('IMPS')) mode='upi';
      else if (det.includes('CASH')) mode='cash';
      cur.txns.push({ date:iso, type:'payment', amount:parseFloat(credit), mode, ref:String(ref||'').trim() });
    }
  }
  return out.filter(p => p.name && (p.opening>0 || p.txns.length>0));
}

function xlDate(s) {
  if (!s) return null;
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (!m) return null;
  let y = m[3]; if (y.length===2) y='20'+y;
  return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}

async function confirmLedgers() {
  const p   = document.getElementById('p3');
  const pts = window._ledger;
  if (!pts) return;
  p.innerHTML = '<span class="text-gray-400">Importing… please wait.</span>';

  const pm = {}; APP.parties.forEach(pt => { pm[pt.name.toLowerCase().trim()] = pt; });
  const txnB = []; const obB = []; const unm = [];

  for (const lp of pts) {
    const match = pm[lp.name.toLowerCase().trim()];
    if (!match) { unm.push(lp.name); continue; }
    const pid = match.id, smId = match.salesman_id;
    if (lp.opening > 0)
      obB.push({ party_id:pid, as_on_date:FY_START, amt_0_30:0, amt_31_60:0, amt_61_90:0, amt_90_plus:lp.opening, total:lp.opening });
    for (const t of lp.txns)
      txnB.push({ party_id:pid, salesman_id:smId, date:t.date, type:t.type, amount:t.amount, mode:t.mode||'na', ref:t.ref||null, source:'import', verified: t.type==='payment' });
  }

  for (let i=0; i<obB.length;  i+=50) await _sb.from('opening_balances').upsert(obB.slice(i,i+50),{onConflict:'party_id,as_on_date'});
  for (let i=0; i<txnB.length; i+=100) await _sb.from('transactions').insert(txnB.slice(i,i+100));

  const [pR,tR,oR] = await Promise.all([
    _sb.from('parties').select('*').order('name'),
    _sb.from('transactions').select('*').gte('date',FY_START).order('date'),
    _sb.from('opening_balances').select('*'),
  ]);
  APP.parties=pR.data||[]; APP.txns=tR.data||[]; APP.openings=oR.data||[];

  p.innerHTML = `<span class="text-green-600 font-medium">✓ ${obB.length} opening balances · ${txnB.length} transactions imported.</span>
    ${unm.length?`<br><span class="text-yellow-600">⚠️ ${unm.length} unmatched: ${unm.slice(0,5).join(', ')}${unm.length>5?'…':''} (run Step 1 first)</span>`:''}`;
}

function switchTab(idx, btn) {
  document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
  document.getElementById('tab-'+idx)?.classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('tab-active'); b.classList.add('text-gray-500'); });
  btn.classList.add('tab-active'); btn.classList.remove('text-gray-500');
}

function updatePmTotal() {
  const amt  = parseFloat(document.getElementById('pm-amt')?.value)||0;
  const disc = parseFloat(document.getElementById('pm-disc')?.value)||0;
  const row  = document.getElementById('pm-total-row');
  const lbl  = document.getElementById('pm-total-lbl');
  if (row && lbl) {
    const total = amt + disc;
    row.classList.toggle('hidden', total===0);
    lbl.textContent = rupees(total);
  }
}

function toggleRef() {
  const m = document.getElementById('pm-mode')?.value;
  const g = document.getElementById('pm-ref-group');
  if (g) g.style.display = m==='cash' ? 'none' : '';
}

async function submitPayment(partyId) {
  const date   = document.getElementById('pm-date').value;
  const amount = parseFloat(document.getElementById('pm-amt').value);
  const disc   = parseFloat(document.getElementById('pm-disc')?.value)||0;
  const mode   = document.getElementById('pm-mode').value;
  const ref    = document.getElementById('pm-ref')?.value.trim() || null;
  const notes  = document.getElementById('pm-notes').value.trim() || null;
  if (!date) { toast('Enter a date','error'); return; }
  if (amount<=0 && disc<=0) { toast('Enter amount or discount','error'); return; }

  const party   = APP.parties.find(p=>p.id===partyId);
  const smId    = party?.salesman_id||ME.id;
  const inserts = [];

  // Main payment (only if amount > 0)
  if (amount > 0) {
    inserts.push({ party_id:partyId, salesman_id:smId, date, type:'payment', amount, mode, ref, notes, source:'manual', verified:false });
  }

  // Discount entry (if any)
  if (disc > 0) {
    inserts.push({ party_id:partyId, salesman_id:smId, date, type:'payment', amount:disc, mode:'discount', ref:null, notes:notes||'Discount', source:'manual', verified:false });
  }

  // Optimistic update
  const tmps = inserts.map(txn => { const t={...txn,id:'tmp_'+Date.now()+'_'+Math.random(),created_at:new Date().toISOString()}; APP.txns.push(t); return t; });
  closeModal();
  navigate(currentView, currentParams);
  toast(amount>0 && disc>0 ? `Payment + ₹${disc} discount recorded` : disc>0 && amount<=0 ? `Discount of ₹${disc} recorded` : 'Payment recorded');

  const { data, error } = await _sb.from('transactions').insert(inserts).select();
  if (error) { tmps.forEach(t=>{ APP.txns=APP.txns.filter(x=>x.id!==t.id); }); toast('Save failed: '+error.message,'error'); return; }
  tmps.forEach((t,i)=>{ const idx=APP.txns.findIndex(x=>x.id===t.id); if(idx>=0&&data[i]) APP.txns[idx]=data[i]; });
  renderNav();
}

async function saveOpeningBalance(partyId) {
  const amount = parseFloat(document.getElementById('ob-amount').value);
  if (isNaN(amount) || amount < 0) { toast('Enter a valid amount','error'); return; }
  const ob = APP.openings.find(o=>o.party_id===partyId && o.as_on_date===FY_START);
  let result;
  if (ob) {
    result = await _sb.from('opening_balances')
      .update({ amt_90_plus: amount, total: amount })
      .eq('party_id', partyId).eq('as_on_date', FY_START)
      .select().single();
  } else {
    result = await _sb.from('opening_balances')
      .insert({ party_id: partyId, as_on_date: FY_START, amt_0_30:0, amt_31_60:0, amt_61_90:0, amt_90_plus: amount, total: amount })
      .select().single();
  }
  if (result.error) { toast(result.error.message,'error'); return; }
  // Update local cache
  const idx = APP.openings.findIndex(o=>o.party_id===partyId && o.as_on_date===FY_START);
  if (idx>=0) APP.openings[idx] = result.data; else APP.openings.push(result.data);
  closeModal(); toast('Opening balance updated ✓');
  navigate('partyDetail',{partyId});
}

async function deleteTxn(txnId) {

  if (error) { toast('Delete failed: '+error.message, 'error'); return; }
  APP.txns = APP.txns.filter(x=>x.id!==txnId);
  closeModal();
  toast(`${t.type==='bill'?'Bill':'Payment'} deleted ✓`);
  navigate(currentView, currentParams);
}

async function submitEditTxn(txnId) {
  const t      = APP.txns.find(x=>x.id===txnId); if (!t) return;
  const date   = document.getElementById('et-date').value;
  const amount = parseFloat(document.getElementById('et-amt').value);
  const mode   = document.getElementById('et-mode')?.value || t.mode;
  const ref    = document.getElementById('et-ref').value.trim() || null;
  const notes  = document.getElementById('et-notes').value.trim() || null;
  if (!date||!amount||amount<=0) { toast('Fill required fields','error'); return; }

  const upd = { date, amount, mode, ref, notes, edited_by:ME.id, edited_at:new Date().toISOString() };
  const logs = ['date','amount','ref','notes']
    .filter(f => String(t[f]||'') !== String(upd[f]||''))
    .map(f => ({ txn_id:txnId, changed_by:ME.id, field_changed:f, old_value:String(t[f]||''), new_value:String(upd[f]||'') }));

  const { error } = await _sb.from('transactions').update(upd).eq('id',txnId);
  if (error) { toast(error.message,'error'); return; }
  if (logs.length) await _sb.from('edit_log').insert(logs);
  patchCache('txns', { ...t, ...upd });
  closeModal(); toast('Updated');
  navigate(currentView, currentParams);
}

async function deleteParty(partyId) {
  // Delete child records first, then the party
  await _sb.from('opening_balances').delete().eq('party_id', partyId);
  await _sb.from('transactions').delete().eq('party_id', partyId);
  const { error } = await _sb.from('parties').delete().eq('id', partyId);
  if (error) { toast('Delete failed: '+error.message, 'error'); return; }
  // Remove from local cache
  APP.parties  = APP.parties.filter(x=>x.id!==partyId);
  APP.txns     = APP.txns.filter(x=>x.party_id!==partyId);
  APP.openings = APP.openings.filter(x=>x.party_id!==partyId);
  closeModal();
  toast('Party deleted ✓');
  navigate('parties');
}

function sendWhatsAppReminder(smId) {
  const sm = APP.profiles.find(p => p.id === smId);
  if (!sm?.mobile) { toast('No mobile number saved for ' + (sm?.name||'salesman'), 'warn'); return; }

  const cutoff    = new Date(); cutoff.setDate(cutoff.getDate() - 15);
  const cutoffStr = cutoff.toISOString().slice(0, 10);

  const overdue = APP.parties
    .filter(p => p.salesman_id === smId)
    .map(p => {
      const out    = getOutstanding(p.id);
      const pmts   = APP.txns.filter(t => t.party_id === p.id && t.type === 'payment');
      const lastPmt= pmts.length ? pmts.reduce((a,c) => a.date > c.date ? a : c).date : null;
      return { name: p.name, out, lastPmt };
    })
    .filter(x => x.out > 0 && (!x.lastPmt || x.lastPmt < cutoffStr))
    .sort((a, b) => b.out - a.out);

  if (!overdue.length) { toast('No overdue parties for ' + sm.name, 'warn'); return; }

  const total = overdue.reduce((s, x) => s + x.out, 0);
  const lines = overdue.map((x, i) =>
    `${i+1}. ${x.name} — ₹${Math.round(x.out).toLocaleString('en-IN')}`
  ).join('\n');

  const msg = `Hi ${sm.name},\n\nFollowing parties have not paid in 15+ days:\n\n${lines}\n\nTotal Overdue: ₹${Math.round(total).toLocaleString('en-IN')}\n\nPlease follow up.\n- Perfect Bathware`;
  window.open('https://wa.me?text=' + encodeURIComponent(msg), '_blank');
}

function fmtMonth(ym) {

  return `${mn[parseInt(m)-1]} ${y}`;
}

function renderSalesTable() {
  const ym = document.getElementById('st-month')?.value || '';
  if (!ym) return;
  const [yr, mo] = ym.split('-').map(Number);
  const from = ym + '-01';
  const lastDay = new Date(yr, mo, 0).getDate();
  const to   = ym + '-' + String(lastDay).padStart(2,'0');

  const salesmen = ME.role === 'admin'
    ? APP.profiles.filter(p=>p.role==='salesman').sort((a,b)=>a.name.localeCompare(b.name))
    : [ME];
  let grandBills = 0, grandCN = 0;

  const rows = salesmen.map(sm => {
    const pids  = new Set(APP.parties.filter(p=>p.salesman_id===sm.id).map(p=>p.id));
    const txns  = APP.txns.filter(t => pids.has(t.party_id) && t.date>=from && t.date<=to);
    const bills = txns.filter(t=>t.type==='bill').reduce((s,t)=>s+(+t.amount),0);
    const cn    = txns.filter(t=>t.type==='credit_note').reduce((s,t)=>s+(+t.amount),0);
    grandBills += bills; grandCN += cn;
    return { sm, bills, cn, net: bills - cn };
  });

  const tbody = document.getElementById('sales-tbody');
  const tfoot = document.getElementById('sales-tfoot');
  if (!tbody) return;

  tbody.innerHTML = rows.length ? rows.map(r=>`
    <tr class="border-t hover:bg-gray-50">
      <td class="px-4 py-3 font-medium">${r.sm.name}</td>
      <td class="px-4 py-3 text-right">${r.bills>0?rupees(r.bills):'—'}</td>
      <td class="px-4 py-3 text-right ${r.cn>0?'text-orange-600 font-medium':''}">${r.cn>0?rupees(r.cn):'—'}</td>
      <td class="px-4 py-3 text-right font-bold text-indigo-700">${rupees(r.net)}</td>
    </tr>`).join('')
    : '<tr><td colspan="4" class="px-4 py-10 text-center text-gray-400">No data for this month</td></tr>';

  tfoot.innerHTML = `
    <tr class="font-semibold">
      <td class="px-4 py-3">Total</td>
      <td class="px-4 py-3 text-right">${rupees(grandBills)}</td>
      <td class="px-4 py-3 text-right ${grandCN>0?'text-orange-600':''}">${grandCN>0?rupees(grandCN):'—'}</td>
      <td class="px-4 py-3 text-right text-indigo-700 text-base">${rupees(grandBills-grandCN)}</td>
    </tr>`;
}

// ─── BILL REGISTER IMPORT ────────────────────────────────────────────────────
function parseSalesRegisterRows(rows) {
  const skipNames = new Set(['cash in hand', 'damage goods']);
  const bills = [];
  for (const row of rows) {
    const dateStr = String(row[0]||'').trim();
    const billRef = String(row[1]||'').trim();
    const party   = String(row[2]||'').trim();
    const amount  = parseFloat(row[3]) || 0;
    if (!dateStr || dateStr.startsWith('-') || !billRef || billRef.startsWith('-')) continue;
    if (!party || party.startsWith('-') || party.startsWith('~')) continue;
    if (party.toLowerCase().includes('sales a/c') || party.toLowerCase().includes('grand total') || party.toLowerCase().includes('rounded off')) continue;
    if (skipNames.has(party.toLowerCase())) continue;
    if (amount <= 0) continue;
    const m = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if (!m) continue;
    let y = m[3]; if (y.length === 2) y = '20' + y;
    const iso = `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    bills.push({ date: iso, ref: billRef, partyName: party.trim(), amount });
  }
  return bills;
}

async function importBillRegister() {
  const p5 = document.getElementById('p5');
  p5.innerHTML = '<p class="text-gray-400">Reading file…</p>';
  let rows;
  try { rows = await readXlsx('f5'); } catch(e) { p5.innerHTML = `<p class="text-red-500">${e}</p>`; return; }

  const bills = parseSalesRegisterRows(rows);
  if (!bills.length) { p5.innerHTML = '<p class="text-red-500">No valid bill rows found in file.</p>'; return; }

  const existingRefs = new Set(APP.txns.filter(t=>t.type==='bill'&&t.ref).map(t=>t.ref.trim()));
  const partyMap = {};
  APP.parties.forEach(p => { partyMap[p.name.trim().toLowerCase()] = p; });

  const toInsert   = [];
  const duplicates = [];
  const unmatched  = new Map();

  for (const b of bills) {
    if (existingRefs.has(b.ref)) { duplicates.push(b); continue; }
    const party = partyMap[b.partyName.toLowerCase()];
    if (party) {
      toInsert.push({ ...b, party_id: party.id });
    } else {
      if (!unmatched.has(b.partyName)) unmatched.set(b.partyName, []);
      unmatched.get(b.partyName).push(b);
    }
  }

  window._billImport = { toInsert, duplicates, unmatched };
  const unmatchedNames = [...unmatched.keys()];
  const smOptions = APP.profiles.filter(pr=>pr.role==='salesman').map(s=>`<option value="${s.id}">${s.name}</option>`).join('');

  p5.innerHTML = `
    <div class="space-y-3 mt-2">
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-green-50 rounded-xl p-3 text-center">
          <p class="text-xs text-green-600">Ready to Import</p>
          <p class="text-xl font-bold text-green-700">${toInsert.length}</p>
        </div>
        <div class="bg-yellow-50 rounded-xl p-3 text-center">
          <p class="text-xs text-yellow-600">Duplicates Skipped</p>
          <p class="text-xl font-bold text-yellow-700">${duplicates.length}</p>

        <div class="bg-orange-50 rounded-xl p-3 text-center">

        <p class="text-xs font-semibold text-orange-700 mb-2">New parties — assign salesman (or leave blank to skip their bills):</p>
        <div class="space-y-2">

          <div class="flex items-center gap-2">
            <span class="flex-1 text-xs text-gray-700">${name} <span class="text-gray-400">(${unmatched.get(name).length} bill${unmatched.get(name).length>1?'s':''})</span></span>
            <select id="ns-${name.replace(/[^a-z0-9]/gi,'_')}" class="border rounded px-2 py-1 text-xs">
              <option value="">— skip —</option>
              ${smOptions}
            </select>
          </div>`).join('')}
        </div>
      </div>` : ''}
      ${(toInsert.length + unmatchedNames.length) > 0 ? `
      <button onclick="confirmBillRegister()" class="w-full bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-indigo-700">
        Confirm Import (${toInsert.length} matched + ${unmatchedNames.length} new party bills)
      </button>` : '<p class="text-gray-400 text-xs">Nothing new to import.</p>'}
    </div>`;
}

async function confirmBillRegister() {
  const p5 = document.getElementById('p5');
  const { toInsert, unmatched } = window._billImport;
  const unmatchedNames = [...unmatched.keys()];

  p5.innerHTML = '<p class="text-gray-400">Importing…</p>';
  let totalInserted = 0;

  try {
    const allBills = [...toInsert];

    for (const name of unmatchedNames) {
      const key = name.replace(/[^a-z0-9]/gi,'_');
      const smId = document.getElementById('ns-' + key)?.value || null;
      if (!smId) continue; // skip if no salesman assigned

      const { data: newParty, error: pe } = await _sb.from('parties').insert([{ name, salesman_id: smId }]).select().single();
      if (pe) throw pe;
      APP.parties.push(newParty);
      for (const b of unmatched.get(name)) allBills.push({ ...b, party_id: newParty.id });
    }

    for (let i = 0; i < allBills.length; i += 50) {
      const batch = allBills.slice(i, i+50).map(b => ({
        party_id: b.party_id, type: 'bill', date: b.date, amount: b.amount,
        ref: b.ref, mode: 'na', verified: true, notes: 'Sales Register Import'
      }));
      const { data, error } = await _sb.from('transactions').insert(batch).select();
      if (error) throw error;
      APP.txns.push(...data);
      totalInserted += data.length;
    }

    const newPartyCount = unmatchedNames.filter(name => {
      const k = name.replace(/[^a-z0-9]/gi,'_');
      return document.getElementById('ns-'+k)?.value;
    }).length;

    window._billImport = null;
    p5.innerHTML = `<div class="bg-green-50 border border-green-200 rounded-xl p-4 text-center">
      <p class="text-green-700 font-bold text-lg">Import Complete</p>
      <p class="text-green-600 text-sm">${totalInserted} bills imported · ${newPartyCount} new parties created</p>
    </div>`;
    toast(`Imported ${totalInserted} bills successfully`, 'success');
  } catch(e) {
    p5.innerHTML = `<p class="text-red-500 text-xs">${e.message||e}</p>`;
    toast('Import failed: ' + (e.message||e), 'error');
  }
}

  initAdminSb();
  const { data: { session } } = await _sb.auth.getSession();
  if (session?.user) await afterLogin(session.user);

  _sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN'  && session?.user && !ME) await afterLogin(session.user);
    if (event === 'SIGNED_OUT') showLogin();
  });
}

init();
</script>
</body>
</html>
